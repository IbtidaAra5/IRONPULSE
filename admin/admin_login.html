<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - IronPulse</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="login-page">
        <form class="login-card" onsubmit="return adminLogin(event)">
            <div class="brand" style="margin:0">⚡ Iron<span>Pulse</span></div>
            <h1>Admin Login</h1>
            <input class="input-field" id="u" required placeholder="Email or username">
            <input class="input-field" id="p" type="password" required placeholder="Password">
            <button class="btn-submit" type="submit">Login</button>
            <p style="color:#6b6b73;font-size:12px;margin-top:16px">Demo: admin / admin</p>
        </form>
    </div>
    <script src="../js/admin.js"></script>
    <script>
        function adminLogin(e) {
            e.preventDefault();
            const u = document.getElementById("u").value.trim().toLowerCase();
            if ((u === "admin" || u === "admin@ironpulse.com") && document.getElementById("p").value === "admin")
                location.href = "admin_dashboard.html";
            else toast("Invalid credentials", false);
            return false;
        }
    </script>
</body>
</html>
