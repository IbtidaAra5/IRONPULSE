<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trainer - IronPulse</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand">Iron<span>Pulse</span></div>
        <div class="user-profile" onclick="location.href='admin_profile.html'">
            <div class="avatar">A</div>
            <div><div class="user-name">Admin</div><div class="user-role">System Administrator</div></div>
        </div>
        <div class="menu">
            <a href="admin_dashboard.html" class="menu-item"><span class="icon">🏠</span> Dashboard</a>
            <a href="add_member.html" class="menu-item"><span class="icon">👥</span> Add member</a>
            <a href="add_trainer.html" class="menu-item active"><span class="icon">➕</span> Add trainer</a>
            <a href="assign_trainer.html" class="menu-item"><span class="icon">👤</span> Assign trainer</a>
            <a href="admin_profile.html" class="menu-item"><span class="icon">⚙️</span> Profile</a>
            <a href="login.html" class="menu-item logout"><span class="icon">🚪</span> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <h1>Trainer Management</h1>
        <div class="subHeader">Add New Trainer</div>
        <form class="form-container" onsubmit="return submitForm(event,'Trainer added successfully!')">
            <div class="form-grid">
                <div class="input-group full"><label>Full Name</label><input class="input-field" required placeholder="Enter trainer's full name"></div>
                <div class="input-group"><label>Age</label><input type="number" min="18" max="70" class="input-field" required placeholder="Age"></div>
                <div class="input-group"><label>Gender</label><select class="input-field" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                <div class="input-group"><label>Contact Number</label><input type="tel" class="input-field" required placeholder="01XXXXXXXXX" pattern="[0-9+\- ]{8,15}"></div>
                <div class="input-group"><label>Email Address</label><input type="email" class="input-field" required placeholder="trainer@email.com"></div>
                <div class="input-group"><label>Password</label><input type="password" minlength="6" class="input-field" required placeholder="Minimum 6 characters"></div>
                <div class="input-group"><label>Specialization</label><select class="input-field" required><option value="">Select</option><option>Strength &amp; Conditioning</option><option>HIIT &amp; Weight Loss</option><option>Bodybuilding</option><option>Nutrition</option><option>Cardio</option></select></div>
                <div class="input-group"><label>Experience (years)</label><input type="number" min="0" class="input-field" required placeholder="e.g. 5"></div>
                <div class="input-group"><label>Monthly Salary (৳)</label><input type="number" min="0" class="input-field" required placeholder="e.g. 30000"></div>
                <div class="input-group full"><label>Upload Certificate</label><input type="file" class="input-field" accept=".pdf,.jpg,.jpeg,.png"></div>
            </div>
            <button class="btn-submit" type="submit">Add Trainer</button>
        </form>
    </div>
    <script src="../js/admin.js"></script>
</body>
</html>
